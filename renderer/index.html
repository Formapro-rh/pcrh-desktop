<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audits PCRH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,650&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

:root{
  --paper:#f6f3ec; --surface:#fffdf9; --surface-2:#efe9dc;
  --ink:#1c2b30; --ink-2:#54636a; --ink-3:#8b959a;
  --border:rgba(28,43,48,0.13); --border-strong:rgba(28,43,48,0.24);
  --accent:#0f6e63; --accent-ink:#063e37; --accent-soft:#e2efec; --accent-soft-2:#cfe4df;
  --brass:#a9822f; --brass-soft:#f3ead2;
  --good:#0ca30c; --good-soft:#e3f5e3;
  --warning:#c98505; --warning-soft:#fbedd2;
  --serious:#c85a2e; --serious-soft:#fbe2d4;
  --critical:#c23a3a; --critical-soft:#f8dede;
  --shadow: 0 1px 2px rgba(28,43,48,0.06), 0 8px 24px -12px rgba(28,43,48,0.18);
  --shadow-lift: 0 2px 4px rgba(28,43,48,0.08), 0 16px 32px -14px rgba(28,43,48,0.28);
  --scrollbar-thumb: rgba(28,43,48,0.18);
  --scrollbar-thumb-hover: rgba(28,43,48,0.32);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12181a; --surface:#1a2224; --surface-2:#212b2d;
    --ink:#eef1ee; --ink-2:#aeb9ba; --ink-3:#7c8888;
    --border:rgba(238,241,238,0.12); --border-strong:rgba(238,241,238,0.22);
    --accent:#3fab9c; --accent-ink:#bfe7de; --accent-soft:#1c302d; --accent-soft-2:#213c37;
    --brass:#d1ab5c; --brass-soft:#2c2413;
    --good:#33c157; --good-soft:#12301c;
    --warning:#e0a52e; --warning-soft:#332608;
    --serious:#e0865a; --serious-soft:#33200f;
    --critical:#e3625f; --critical-soft:#3a1616;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --shadow-lift: 0 2px 4px rgba(0,0,0,0.4), 0 18px 36px -14px rgba(0,0,0,0.65);
    --scrollbar-thumb: rgba(238,241,238,0.14);
    --scrollbar-thumb-hover: rgba(238,241,238,0.26);
  }
}
:root[data-theme="dark"]{
  --paper:#12181a; --surface:#1a2224; --surface-2:#212b2d;
  --ink:#eef1ee; --ink-2:#aeb9ba; --ink-3:#7c8888;
  --border:rgba(238,241,238,0.12); --border-strong:rgba(238,241,238,0.22);
  --accent:#3fab9c; --accent-ink:#bfe7de; --accent-soft:#1c302d; --accent-soft-2:#213c37;
  --brass:#d1ab5c; --brass-soft:#2c2413;
  --good:#33c157; --good-soft:#12301c;
  --warning:#e0a52e; --warning-soft:#332608;
  --serious:#e0865a; --serious-soft:#33200f;
  --critical:#e3625f; --critical-soft:#3a1616;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  --shadow-lift: 0 2px 4px rgba(0,0,0,0.4), 0 18px 36px -14px rgba(0,0,0,0.65);
  --scrollbar-thumb: rgba(238,241,238,0.14);
  --scrollbar-thumb-hover: rgba(238,241,238,0.26);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:"Fraunces", Georgia, serif; text-wrap:balance; letter-spacing:-0.01em;}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}
.tnum{font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:inherit; font-size:inherit; color:inherit;}
::selection{background:var(--accent-soft-2);}

/* ---------- Global motion & scrollbars ---------- */
button{ transition:background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .08s ease, opacity .15s ease; }
button:active:not(:disabled){ transform:translateY(1px); }
input, select, textarea{ transition:border-color .15s ease, box-shadow .15s ease; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent-soft-2); outline-offset:2px;
}
::-webkit-scrollbar{ width:11px; height:11px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--scrollbar-thumb); border-radius:7px; border:3px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover{ background:var(--scrollbar-thumb-hover); background-clip:padding-box; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes popIn{ from{opacity:0; transform:scale(.96) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);} }
@keyframes slideDown{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

#app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:236px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:22px 16px; gap:22px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; flex-direction:column; gap:2px; padding:0 6px;}
.brand .mark{display:flex; align-items:center; gap:9px;}
.brand .seal{
  width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--surface);
  display:flex; align-items:center; justify-content:center; font-family:"Fraunces",serif; font-weight:650; font-size:14px;
  box-shadow:var(--shadow); flex:none;
}
.brand .name{font-family:"Fraunces",serif; font-weight:600; font-size:17px; line-height:1.15;}
.brand .sub{color:var(--ink-3); font-size:11.5px; padding-left:39px; margin-top:-2px;}
.nav{display:flex; flex-direction:column; gap:2px;}
.nav-item{
  position:relative;
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer;
  color:var(--ink-2); font-size:13.5px; font-weight:500; border:1px solid transparent; background:none; text-align:left; width:100%;
}
.nav-item svg{flex:none; opacity:0.8; transition:opacity .15s ease;}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent-soft-2); font-weight:600;}
.nav-item.active svg{opacity:1;}
.nav-item.active::before{
  content:''; position:absolute; left:-16px; top:9px; bottom:9px; width:3px; border-radius:0 4px 4px 0; background:var(--accent);
}
.btn-new{
  display:flex; align-items:center; justify-content:center; gap:7px; padding:10px 12px; border-radius:9px;
  background:var(--accent); color:#fff; font-weight:600; font-size:13.5px; border:none; cursor:pointer; box-shadow:var(--shadow);
}
.btn-new:hover{filter:brightness(1.08); box-shadow:var(--shadow-lift); transform:translateY(-1px);}
.btn-new:active{transform:translateY(0);}
.sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px;}
.sync-pill{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-3); padding:0 6px;}
.dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex:none;}
.dot.off{background:var(--ink-3);}
.field-hint{font-size:11px; color:var(--ink-3); padding:0 6px;}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; padding:30px 38px 60px; position:relative; overflow:hidden;}
.container{max-width:1120px; margin:0 auto; position:relative; z-index:1;}

.dash-blobs{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
.dash-blobs svg{position:absolute;}
.dash-blobs .blob-1{top:-18%; right:-10%; left:auto; width:32vw; max-width:420px; min-width:260px; opacity:0.4;}
.dash-blobs .blob-1 path{fill:var(--accent-soft);}
.dash-blobs .blob-2{bottom:-22%; left:-12%; width:28vw; max-width:380px; min-width:220px; opacity:0.35;}
.dash-blobs .blob-2 path{fill:var(--brass-soft);}
.pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
.pagehead h1{font-size:26px; margin:0 0 4px;}
.pagehead .lede{color:var(--ink-2); font-size:13.5px; max-width:60ch;}
.hactions{display:flex; gap:10px;}

.btn{display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface); cursor:pointer; font-weight:500; font-size:13px;}
.btn:hover:not(:disabled){background:var(--surface-2); border-color:var(--ink-3);}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn.primary:hover:not(:disabled){filter:brightness(1.08); box-shadow:var(--shadow-lift);}
.btn.ghost{border-color:transparent; background:none;}
.btn.ghost:hover:not(:disabled){background:var(--surface-2); border-color:transparent;}
.btn.danger{color:var(--critical); border-color:var(--critical-soft);}
.btn.danger:hover:not(:disabled){background:var(--critical-soft);}
.btn:disabled{opacity:0.5; cursor:not-allowed;}
.btn svg{flex:none;}

/* KPI tiles */
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 17px; box-shadow:var(--shadow); transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;}
.kpi:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:var(--border-strong);}
.kpi .label{font-size:11.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:0.05em; font-weight:600;}
.kpi .value{font-family:"Fraunces",serif; font-size:29px; font-weight:600; margin-top:5px;}
.kpi .sub{font-size:12px; color:var(--ink-2); margin-top:3px;}

.panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); margin-bottom:20px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap;}
.panel-head h2{font-size:15.5px; margin:0;}
.panel-body{padding:18px 20px;}

/* Chart */
.chart-wrap{padding:6px 4px 0;}
.chart-empty{color:var(--ink-3); font-size:13px; padding:30px 10px; text-align:center;}

/* Filters */
.filters{display:flex; gap:9px; flex-wrap:wrap; align-items:center;}
.filters input, .filters select{
  padding:7px 10px; border-radius:7px; border:1px solid var(--border-strong); background:var(--paper); color:var(--ink); font-size:12.5px; min-width:120px;
}
.filters input:focus, .filters select:focus, textarea:focus, input:focus{outline:2px solid var(--accent-soft-2); outline-offset:1px;}

/* Table */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-3); font-weight:600; padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle; transition:background-color .12s ease;}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:var(--surface-2);}
.ref{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2);}
.client-cell{font-weight:600;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap;}
.badge .bdot{width:6px; height:6px; border-radius:50%; flex:none;}
.badge.brouillon{background:var(--surface-2); color:var(--ink-2);}
.badge.brouillon .bdot{background:var(--ink-3);}
.badge.en_cours{background:var(--warning-soft); color:var(--warning);}
.badge.en_cours .bdot{background:var(--warning);}
.badge.cloture{background:var(--good-soft); color:var(--good);}
.badge.cloture .bdot{background:var(--good);}
.badge.ouvert{background:var(--critical-soft); color:var(--critical);}
.badge.ouvert .bdot{background:var(--critical);}
.badge.en_cours_nc{background:var(--warning-soft); color:var(--warning);}
.badge.en_cours_nc .bdot{background:var(--warning);}
.badge.clos{background:var(--good-soft); color:var(--good);}
.badge.clos .bdot{background:var(--good);}
.badge.mineure{background:var(--warning-soft); color:var(--warning);}
.badge.majeure{background:var(--serious-soft); color:var(--serious);}
.badge.critique{background:var(--critical-soft); color:var(--critical);}

.score-chip{display:inline-flex; align-items:baseline; gap:2px; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:13px;}
.score-chip .u{font-size:10px; color:var(--ink-3); font-weight:500;}
.score-good{color:var(--good);}
.score-warn{color:var(--warning);}
.score-bad{color:var(--critical);}
.score-none{color:var(--ink-3);}

.stat-chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip{display:flex; align-items:center; gap:7px; padding:6px 11px; border-radius:9px; background:var(--surface-2); font-size:12.5px; font-weight:500;}
.chip .cdot{width:8px; height:8px; border-radius:50%; flex:none;}

.empty-state{text-align:center; padding:48px 24px; color:var(--ink-2);}
.empty-state .glyph{width:46px; height:46px; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-family:"Fraunces",serif; font-size:20px; font-weight:600; box-shadow:0 0 0 6px var(--surface-2);}
.empty-state h3{margin:0 0 6px; font-size:16px; color:var(--ink);}
.empty-state p{margin:0 0 16px; font-size:13px; max-width:44ch; margin-left:auto; margin-right:auto;}

/* ---------- Form / mission edit ---------- */
.form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.form-grid.wide{grid-template-columns:1fr;}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:11.5px; font-weight:600; color:var(--ink-2); text-transform:uppercase; letter-spacing:0.04em;}
.field input, .field select, .field textarea{
  padding:9px 11px; border-radius:8px; border:1px solid var(--border-strong); background:var(--paper); color:var(--ink); font-size:13.5px; font-family:inherit; width:100%;
}
.field textarea{resize:vertical; min-height:64px; line-height:1.45;}

.score-hero{display:flex; align-items:center; gap:18px; padding:16px 20px;}
.gauge{position:relative; width:82px; height:82px; flex:none;}
.gauge svg{transform:rotate(-90deg);}
.gauge .gval{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:17px;}
.score-hero .meta{display:flex; flex-direction:column; gap:3px;}
.score-hero .meta .t{font-size:12px; color:var(--ink-3); text-transform:uppercase; letter-spacing:0.05em; font-weight:600;}
.score-hero .meta .d{font-size:12.5px; color:var(--ink-2);}

.cat-block{border-bottom:1px solid var(--border);}
.cat-block:last-child{border-bottom:none;}
.cat-head{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; cursor:pointer; gap:14px; transition:background-color .12s ease;}
.cat-head:hover{background:var(--surface-2);}
.cat-head .left{display:flex; align-items:center; gap:10px; min-width:0;}
.cat-head .chev{transition:transform .15s ease; flex:none; color:var(--ink-3);}
.cat-head.open .chev{transform:rotate(90deg);}
.cat-head h3{font-size:14px; margin:0; font-weight:600;}
.cat-head .n{font-size:11.5px; color:var(--ink-3);}
.cat-score{font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:600; flex:none;}
.cat-body{padding:2px 20px 14px;}
.sd-head{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent-ink); background:var(--accent-soft); padding:7px 10px; border-radius:7px; margin:16px 0 4px;}
.sd-head:first-child{margin-top:6px;}
.crit-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:11px 0; border-top:1px solid var(--border);}
.crit-row:first-child{border-top:none;}
.sd-head + .crit-row{border-top:none;}
.crit-main{flex:1; min-width:0;}
.crit-label{font-size:13px; line-height:1.4; margin-bottom:7px;}
.crit-comment{width:100%; padding:6px 9px; border-radius:6px; border:1px solid var(--border); background:var(--paper); font-size:12px; font-family:inherit;}
.seg{display:flex; gap:5px; flex:none;}
.seg button{
  padding:6px 10px; border-radius:7px; border:1px solid var(--border-strong); background:var(--surface); font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.seg button:hover{background:var(--surface-2);}
.seg button.sel-na{background:var(--surface-2); border-color:var(--border-strong); color:var(--ink-2);}
.seg button.sel-0{background:var(--critical); border-color:var(--critical); color:#fff;}
.seg button.sel-1{background:var(--warning); border-color:var(--warning); color:#fff;}
.seg button.sel-2{background:var(--good); border-color:var(--good); color:#fff;}

.ref-wrap{position:relative; display:inline-block; margin-left:6px; vertical-align:middle;}
.ref-btn{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; padding:0; border-radius:6px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-2); cursor:pointer; vertical-align:middle;}
.ref-btn:hover, .ref-btn.open{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent-soft-2);}
.ref-menu{position:absolute; z-index:20; top:calc(100% + 4px); left:0; min-width:230px; background:var(--surface); border:1px solid var(--border-strong); border-radius:9px; box-shadow:var(--shadow-lift); padding:5px; display:flex; flex-direction:column; gap:2px; animation:slideDown .12s ease-out;}
.ref-item{display:block; width:100%; text-align:left; padding:7px 9px; border-radius:6px; border:none; background:none; color:var(--accent-ink); font-size:12px; font-family:inherit; cursor:pointer;}
.ref-item:hover{background:var(--accent-soft);}

.nc-card{border:1px solid var(--border); border-radius:11px; padding:14px 16px; margin-bottom:12px; background:var(--paper); transition:border-color .15s ease;}
.nc-card:hover{border-color:var(--border-strong);}
.nc-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
.nc-ref{font-size:11.5px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace;}
.nc-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.nc-grid .full{grid-column:1 / -1;}

.divider-note{font-size:12px; color:var(--ink-3); padding:12px 20px;}

/* Report / print view */
.report-head{display:flex; justify-content:space-between; align-items:flex-start; padding:22px 24px; gap:20px; flex-wrap:wrap;}
.report-id{font-size:12px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace; margin-bottom:6px;}
.report-title{font-size:22px; margin:0 0 6px;}
.report-meta{display:grid; grid-template-columns:repeat(2,auto); gap:4px 28px; font-size:12.5px; color:var(--ink-2); margin-top:10px;}
.report-meta b{color:var(--ink); font-weight:600;}
.report-cats{padding:0 4px;}
.report-cat-row{display:flex; align-items:center; justify-content:space-between; padding:10px 20px; border-top:1px solid var(--border);}
.report-crit-detail{padding:0 20px 6px;}
.report-crit-line{display:flex; justify-content:space-between; gap:14px; padding:7px 0 7px 14px; border-top:1px dashed var(--border); font-size:12.5px;}
.report-crit-line .txt{color:var(--ink-2);}
.report-crit-line .txt b{color:var(--ink); font-weight:500;}

@media print{
  .sidebar, .hactions, .no-print, .toast{display:none !important;}
  .main{padding:0;}
  body{background:#fff;}
  .panel{box-shadow:none; border:1px solid #ccc;}
}

@media (max-width: 900px){
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .form-grid{grid-template-columns:1fr;}
  .nc-grid{grid-template-columns:1fr;}
}

.modal-back{position:fixed; inset:0; background:rgba(10,14,15,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; animation:fadeIn .14s ease-out;}
.modal{background:var(--surface); border-radius:14px; padding:22px; max-width:400px; width:100%; box-shadow:var(--shadow-lift); border:1px solid var(--border); animation:popIn .16s ease-out;}
.modal h3{margin:0 0 8px; font-size:16px;}
.modal p{margin:0 0 18px; font-size:13px; color:var(--ink-2);}
.modal .row{display:flex; gap:10px; justify-content:flex-end;}

.toast{position:fixed; bottom:22px; right:22px; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:9px; font-size:12.5px; box-shadow:var(--shadow); z-index:60; opacity:0; transform:translateY(6px); transition:opacity .2s, transform .2s; pointer-events:none;}
.toast.show{opacity:1; transform:translateY(0);}

/* ---------------- Login / setup screen ---------------- */
.login-screen{
  position:relative; overflow:hidden;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--paper);
  padding:24px;
}
.bg-blobs{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
.bg-blobs svg{position:absolute;}
.bg-blobs .blob path{transition:fill .2s ease;}
.blob-1{top:-14%; left:-12%; width:56vw; max-width:680px; min-width:360px;}
.blob-1 path{fill:var(--accent-soft);}
.blob-2{bottom:-20%; right:-10%; width:46vw; max-width:560px; min-width:300px;}
.blob-2 path{fill:var(--brass-soft);}
.blob-line{top:8%; right:6%; width:40vw; max-width:460px; min-width:260px; opacity:0.5;}
.blob-line path{stroke:var(--ink-2);}
.login-card{position:relative; z-index:1; width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-lift); padding:30px 30px 26px; animation:popIn .22s ease-out;}
.login-brand{display:flex; align-items:center; gap:11px; margin-bottom:6px;}
.login-brand .seal{width:36px; height:36px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:"Fraunces",serif; font-weight:650; font-size:16px; flex:none; box-shadow:var(--shadow);}
.login-brand .name{font-family:"Fraunces",serif; font-weight:600; font-size:19px;}
.login-sub{color:var(--ink-2); font-size:12.5px; margin:0 0 22px; padding-left:47px; margin-top:-4px;}
.tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px; margin-bottom:20px;}
.tab{flex:1; text-align:center; padding:8px 10px; border-radius:7px; border:none; background:none; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-2);}
.tab.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
.login-field{display:flex; flex-direction:column; gap:5px; margin-bottom:13px;}
.login-field label{font-size:11.5px; font-weight:600; color:var(--ink-2); text-transform:uppercase; letter-spacing:0.04em;}
.login-field input{padding:10px 12px; border-radius:8px; border:1px solid var(--border-strong); background:var(--paper); color:var(--ink); font-size:13.5px; width:100%;}
.folder-row{display:flex; gap:8px; align-items:stretch;}
.folder-row .folder-display{flex:1; padding:10px 12px; border-radius:8px; border:1px dashed var(--border-strong); background:var(--paper); font-size:12px; color:var(--ink-2); display:flex; align-items:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:"IBM Plex Mono",monospace;}
.login-error{background:var(--critical-soft); color:var(--critical); border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:13px; display:flex; gap:8px; align-items:flex-start;}
.login-hint{font-size:11.5px; color:var(--ink-3); margin-top:14px; line-height:1.5;}
.btn-login{width:100%; padding:11px; border-radius:9px; background:var(--accent); color:#fff; font-weight:600; font-size:13.5px; border:none; cursor:pointer; margin-top:6px;}
.btn-login:hover:not(:disabled){filter:brightness(1.08); box-shadow:var(--shadow-lift);}
.btn-login:disabled{opacity:0.55; cursor:not-allowed;}

/* Settings panel */
.settings-row{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-top:1px solid var(--border);}
.settings-row:first-child{border-top:none;}
.settings-row .k{font-size:12.5px; color:var(--ink-2);}
.settings-row .v{font-size:12.5px; font-family:"IBM Plex Mono",monospace; color:var(--ink);}

</style>
</head>
